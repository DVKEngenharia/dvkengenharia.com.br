<style>
/* Layout: página única do site; cabeçalho marinho fixo, uma pergunta por tela em coluna de 560px; no desktop vira cartão sobre fundo claro */
:root{
  --navy:#0E1E35;--navy2:#16304f;--sun:#E8A23A;--sun-d:#B26F12;--ink:#13202f;--ink2:#2a3a4d;--muted:#4f5e70;
  --bg:#F3F5F8;--paper:#fff;--soft:#f6f8fb;--soft2:#eef2f6;--edge:#8a97a8;--edge2:#d3dbe5;--ok:#1f7a4d;--bad:#b3261e;
  --display:"Fraunces",Georgia,serif;--body:"Instrument Sans",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body)}
.app{min-height:100%;display:flex;flex-direction:column}
.head{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:12px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.head .in,.main{width:100%;max-width:560px;margin:0 auto}
.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand b{font:600 13px var(--body);letter-spacing:.06em}
.brand a{color:#f3c47e;font-size:13px;text-decoration:none;border:1px solid #f3c47e88;padding:0 14px;min-height:38px;display:inline-flex;align-items:center;border-radius:99px}
.bar{height:5px;border-radius:5px;background:#ffffff2a;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--sun);transition:width .3s}
.steplbl{font:500 11.5px var(--mono);color:#c3cfdd;margin-top:8px;min-height:1.2em}
.main{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:24px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
@media(min-width:700px){body{background:var(--bg)}.main{background:var(--paper);border-radius:18px;margin-block:28px;box-shadow:0 6px 30px rgba(14,30,53,.08);padding:32px;flex:0 0 auto;min-height:600px}}
h1,h2{font:600 22px/1.25 var(--display);margin:0;color:var(--navy);outline:none;text-wrap:balance}
.sub{font-size:14px;color:var(--muted);margin:0}
.opt{font-weight:400;color:var(--muted);font-size:12.5px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13.5px;font-weight:500;color:var(--ink2);min-width:0}
input,select,textarea{font:16px var(--body);padding:11px 12px;border:1.5px solid var(--edge);border-radius:10px;background:#fff;color:var(--ink);min-height:48px;width:100%;box-sizing:border-box}
input:focus,select:focus,textarea:focus{outline:3px solid var(--sun-d);outline-offset:1px}
[aria-invalid="true"]{border-color:var(--bad)!important}
.err{color:var(--bad);font-size:13.5px;font-weight:500;min-height:1em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.col{flex-direction:column}
.chip{font:500 14.5px var(--body);min-height:46px;padding:10px 14px;border-radius:10px;border:1.5px solid var(--edge);background:#fff;color:var(--ink);cursor:pointer;text-align:left;display:flex;align-items:center;gap:8px}
.chips.col .chip{width:100%}
.chip small{color:var(--muted);font-weight:400;display:block}
.chip[aria-pressed="true"]{border-color:var(--navy);background:var(--navy);color:#fff}
.chip[aria-pressed="true"] small{color:#c3cfdd}
.chip.multi::before{content:"";width:18px;height:18px;border-radius:5px;border:1.5px solid currentColor;flex:none}
.chip.multi[aria-pressed="true"]::before{content:"✓";display:grid;place-items:center;font-size:12px;background:var(--sun);color:#1c1204;border-color:var(--sun)}
button:focus-visible,a:focus-visible,label.btn:focus-within{outline:3px solid var(--sun-d);outline-offset:2px}
.q{display:flex;flex-direction:column;gap:8px}
.q>span{font-size:14px;font-weight:600;color:var(--ink2)}
.up{border:1.5px dashed var(--edge);border-radius:12px;padding:16px;text-align:center;background:var(--soft);display:flex;flex-direction:column;gap:8px;align-items:center}
.up b{font-size:14px}.up small{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;width:100%}
.files li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ok);font-weight:600;background:#e9f5ee;border-radius:8px;padding:4px 4px 4px 10px;text-align:left}
.files li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.x{border:0;background:none;color:var(--muted);min-width:36px;min-height:36px;cursor:pointer;font-size:16px;border-radius:8px}
.nav{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:8px}
.nav .r{display:flex;gap:10px}
.btn{flex:1;font:600 15px var(--body);min-height:50px;padding:12px;border-radius:12px;border:0;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pri{background:var(--sun);color:#1c1204}
.sec{background:var(--soft2);color:var(--ink);flex:0 0 96px}
.dark{background:var(--navy);color:#fff}
.small{flex:0 0 auto;min-height:44px;padding:8px 14px;font-size:13.5px}
.link{background:none;color:var(--navy2);text-decoration:underline;min-height:44px;padding:0;font-weight:500;font-size:14px;flex:0 0 auto;justify-content:flex-start}
.skip{align-self:center;color:var(--muted)}
.trust{display:flex;gap:8px;flex-wrap:wrap}
.trust span{font:500 12px var(--body);background:var(--soft2);padding:6px 10px;border-radius:8px;color:var(--ink2)}
.note{font-size:12.5px;color:var(--muted);margin:0;background:var(--soft);border-radius:8px;padding:10px}
.note a{color:var(--navy2)}
.box{border:1.5px solid var(--edge2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.box .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box .hd b{font-size:14.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.two>*{min-width:0}
.combo{display:grid;grid-template-columns:1fr 1.25fr;gap:6px}
.seg{display:flex;border:1.5px solid var(--edge);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;font:500 13.5px var(--body);min-height:44px;cursor:pointer;color:var(--ink)}
.seg button+button{border-left:1.5px solid var(--edge2)}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.calc{font:500 12.5px var(--mono);color:var(--navy2);background:var(--soft2);border-radius:8px;padding:6px 10px}
.reveal{border-left:3px solid var(--sun);padding-left:12px;display:flex;flex-direction:column;gap:10px}
.loc{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ok);font-weight:600}
/* Tela final */
.done{gap:18px}
.seal{width:64px;height:64px;border-radius:50%;background:var(--navy);display:grid;place-items:center}
.seal svg{width:32px;height:32px}
.seal path{stroke:var(--sun);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:0}
@media (prefers-reduced-motion:no-preference){.seal path{animation:draw .6s .15s ease-out both}@keyframes draw{from{stroke-dashoffset:40}}}
.proto{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--mono);background:var(--soft2);padding:8px 12px;border-radius:8px;color:var(--navy);align-self:flex-start}
.proto b{font-weight:600;letter-spacing:.03em}
.kick{font:500 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--sun-d);margin:0}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:14px;position:relative}
.steps li::before{content:attr(data-n);width:28px;height:28px;border-radius:50%;border:1.5px solid var(--navy);display:grid;place-items:center;font:600 12.5px var(--mono);color:var(--navy);background:#fff;position:relative;z-index:1}
.steps li:first-child::before{background:var(--navy);color:#fff}
.steps li:not(:last-child)::after{content:"";position:absolute;left:13.5px;top:28px;bottom:0;width:1.5px;background:var(--edge2)}
.steps b{display:block;font-size:14.5px}
.steps span{font-size:13.5px;color:var(--muted)}
.sum{border:1.5px solid var(--edge2);border-radius:12px;overflow:hidden}
.sum dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;padding:14px;font-size:13.5px}
.sum dt{color:var(--muted)}.sum dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.sum .btn{border-radius:0;width:100%}
.port{background:var(--navy);color:#fff;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.port h3{font:600 18px var(--display);margin:0}
.port p{margin:0;font-size:13px;color:#c3cfdd}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.thumbs div{aspect-ratio:1;border-radius:8px;display:flex;align-items:flex-end;padding:6px;font:500 10.5px/1.25 var(--body);color:#fff;max-width:100%}
.thumbs div:nth-child(1){background:linear-gradient(160deg,#3f6b9a,#1b3352 60%,#0b1524)}
.thumbs div:nth-child(2){background:linear-gradient(160deg,#9a8a3f,#4e5a2a 55%,#1d2a14)}
.thumbs div:nth-child(3){background:linear-gradient(160deg,#5f7f98,#2b3f55 55%,#121c29)}
.port .btn{background:#fff;color:var(--navy)}
.help{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.help p{margin:0;font-size:13.5px;color:var(--muted)}
.wa{background:#e9f5ee;color:#14532d}
.foot{text-align:center;font:500 11px var(--mono);color:#8a97a8;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
dialog{border:0;border-radius:14px;padding:0;max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:rgba(14,30,53,.55)}
.pv{padding:18px;font-size:13px;max-height:75vh;overflow:auto}
.pv h4{font:600 16px var(--display);margin:12px 0 4px;color:var(--navy)}
@media (prefers-reduced-motion:no-preference){.main>*{animation:in .22s ease both}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<dialog id="dlg"><div class="pv" id="pv"></div><div style="padding:0 18px 18px"><button type="button" class="btn dark" style="width:100%" onclick="document.getElementById('dlg').close()">Fechar</button></div></dialog>

<script>
/* Endereço do Apps Script (Implantar > App da Web). Vazio = modo demonstração, nada é enviado. */
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwXPV3O-oAPEr4blPWNOAkq4ddNAwwRqobYqsvhRKb2wvndOaeNWRyTVQfXCXGxg4Yb/exec';
/* ---------- estado ---------- */
const blank=()=>({contas:[],imoveis:[],eq:{},ev:{tipo:'100% elétrico',qtd:'1',uso:'recargas',carregador:''},foto:[],skipped:[]});
const S={step:0,hist:[],a:blank()};
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A=()=>S.a;
const EQ=['Ar-condicionado','Carro elétrico','Piscina / bomba','Chuveiro ou aquecedor elétrico','Bomba d\'água / irrigação','Freezer / câmara fria','Forno ou cooktop elétrico','Motor / máquina','Ampliação do imóvel','Outro'];
/* bateria de referência (kWh); conferir antes de publicar */
const EV={'BYD Dolphin Mini':[38,'100% elétrico'],'BYD Dolphin':[44.9,'100% elétrico'],'BYD Yuan Plus':[60.5,'100% elétrico'],'BYD Seal':[82.5,'100% elétrico'],'BYD Song Plus (híbrido)':[18.3,'Híbrido plug-in'],'GWM Ora 03':[63,'100% elétrico'],'Volvo EX30':[69,'100% elétrico'],'Renault Kwid E-Tech':[26.8,'100% elétrico']};
const PER={dia:30,semana:4.3,'mês':1};
let uid=0;
const comOuRural=()=>A().tipo==='Comércio / empresa'||A().tipo==='Rural / fazenda';

/* ---------- componentes ---------- */
const group=(label,inner)=>{const id='g'+(++uid);return `<div class="q" role="group" aria-labelledby="${id}"><span id="${id}">${label}</span>${inner}</div>`};
const chips=(key,opts,{col,auto}={})=>`<div class="chips${col?' col':''}">${opts.map(o=>{const[t,s]=Array.isArray(o)?o:[o];return `<button type="button" class="chip" data-k="${key}" data-v="${esc(t)}"${auto?' data-auto="1"':''} aria-pressed="${A()[key]===t}">${s?`<span>${t}<small>${s}</small></span>`:t}</button>`}).join('')}</div>`;
function upload(path,title,sub,multi=true){const list=get(path)||[];const id='f'+(++uid);
 return `<div class="up"><b>${title}</b><small>${sub}</small><div class="row">
 <label class="btn dark small">📷 Tirar foto<input type="file" accept="image/*" capture="environment" data-file="${path}" hidden></label>
 <label class="btn dark small">${list.length?'Adicionar arquivo':'Escolher arquivo'}<input type="file" accept="image/*,application/pdf" ${multi?'multiple':''} data-file="${path}" hidden></label></div>
 ${list.length?`<ul class="files">${list.map((n,i)=>`<li><span>✓ ${esc(n.name)}</span><button type="button" class="x" aria-label="Remover ${esc(n.name)}" data-rmfile="${path}|${i}">✕</button></li>`).join('')}</ul>`:''}</div>`}
function get(path){return path.split('.').reduce((o,k)=>o?.[k],A())}
function set(path,val){const ks=path.split('.');let o=A();ks.slice(0,-1).forEach(k=>o=o[k]);o[ks.at(-1)]=val}
const nav=({label='Continuar',back=true,skip=false,submit=true}={})=>`<span class="err" id="e" role="alert"></span><div class="nav"><div class="r">${back?'<button type="button" class="btn sec" data-back="1">Voltar</button>':''}${submit?`<button type="submit" class="btn pri">${label}</button>`:''}</div>${skip?'<button type="button" class="btn link skip" data-skip="1">Pular esta pergunta</button>':''}</div>`;
const val=k=>esc(A()[k]);

/* ---------- telas ---------- */
const V=[
{l:'Leva cerca de 3 minutos',h:()=>`<p class="kick">Orçamento de energia solar</p><h1 tabindex="-1">Vamos preparar seu projeto de energia solar?</h1><p class="sub">Responda algumas perguntas rápidas e envie sua conta de luz. Um engenheiro da DVK analisa e devolve a proposta pelo WhatsApp.</p><div class="trust"><span>ART em todo projeto</span><span>Desde 2019</span><span>279 kWp instalados</span></div><p class="note">Só 4 respostas são obrigatórias. As demais você pode pular.</p>${nav({label:'Começar',back:false})}`},

{l:'Seu imóvel',h:()=>`<h1 tabindex="-1">Onde vai ser a instalação?</h1>${chips('tipo',[['Residência','Casa ou apartamento'],['Comércio / empresa','Loja, escritório, indústria'],['Rural / fazenda','Sítio, fazenda, irrigação'],['Condomínio','Áreas comuns']],{col:1,auto:!comOuRural()})}${comOuRural()?`<div class="reveal">${group('A conta é de alta tensão (Grupo A)? <span class="opt">(opcional)</span>',chips('grupoA',['Sim','Não','Não sei']))}${A().tipo==='Rural / fazenda'?group('Tem rede da concessionária no local? <span class="opt">(opcional)</span>',chips('rede',['Sim','Não, preciso de sistema isolado','Não sei'])):''}</div>${nav()}`:nav({submit:false})}`,
 ok:a=>a.tipo?'':'Escolha o tipo de imóvel.'},

{l:'Seu imóvel',h:()=>{const a=A();return `<h1 tabindex="-1">Qual o CEP do imóvel?</h1><p class="sub">Com ele identificamos a concessionária e a incidência de sol na região.</p>${a.semcep?`<label class="f">Cidade<input id="cidade" autocomplete="address-level2" value="${val('cidade')}"></label>`:`<label class="f">CEP<input id="cep" inputmode="numeric" autocomplete="postal-code" placeholder="42700-000" value="${val('cep')}"></label><button type="button" class="btn link" data-tgl="semcep">Imóvel rural sem CEP? Informe a cidade</button>`}
 <div class="box"><div class="hd"><b>📍 Localização do imóvel <span class="opt">(opcional)</span></b></div><p class="sub" style="font-size:13px">Ajuda nossa engenharia a analisar o telhado por satélite antes da visita.</p>
 ${a.loc?`<div class="loc">✓ Localização recebida <button type="button" class="x" aria-label="Remover localização" data-rmloc="1">✕</button></div>`:a.longe?`<p class="sub" style="font-size:13px">Sem problema, seguimos pelo CEP.</p><button type="button" class="btn link" data-tgl="longe">Estou no imóvel agora</button>`:`<div class="row" style="justify-content:flex-start"><button type="button" class="btn dark small" data-geo="1">Enviar minha localização</button><button type="button" class="btn link" data-tgl="longe">Não estou no local</button></div>`}
 <span class="err" id="geoe" role="status"></span></div>${nav()}`},
 ok:a=>{if(a.semcep)return (a.cidade||'').trim().length>1||a.loc?'':['Informe a cidade do imóvel.','cidade'];return (a.cep||'').replace(/\D/g,'').length===8?'':['O CEP tem 8 números, ex.: 42700-000.','cep']}},

{l:'Sua conta de luz',h:()=>`<h1 tabindex="-1">Envie sua conta de luz</h1><p class="sub">É com ela que dimensionamos o sistema. Pode enviar mais de uma, por exemplo meses diferentes ou mais de uma unidade no mesmo endereço.</p>${A().semconta?`<label class="f">Consumo médio por mês <span class="opt">(aparece na conta, em kWh)</span><input id="kwh" inputmode="numeric" value="${val('kwh')}" placeholder="ex.: 650"></label><button type="button" class="btn link" data-tgl="semconta">Tenho a conta, vou enviar</button>`:`${upload('contas','Foto ou PDF da conta','JPG, PNG ou PDF, até 10 MB cada')}<button type="button" class="btn link" data-tgl="semconta">Estou sem a conta, vou informar o consumo</button>`}<p class="note">🔒 Sua conta e seus dados servem só para este orçamento. Vão direto para a equipe técnica da DVK e não ficam no site. <a href="privacidade.html" target="_blank" rel="noopener">Política de privacidade</a></p>${nav()}`,
 ok:a=>a.semconta?(+a.kwh>=30&&+a.kwh<=100000?'':['Informe um consumo entre 30 e 100.000 kWh por mês.','kwh']):(a.contas.length?'':'Falta a conta de luz. Envie uma foto ou informe o consumo em kWh.')},

{l:'Seu contato',h:()=>`<h1 tabindex="-1">Para quem enviamos a proposta?</h1><label class="f">Nome<input id="nome" autocomplete="name" value="${val('nome')}"></label><label class="f">WhatsApp<input id="tel" inputmode="tel" autocomplete="tel" placeholder="(71) 9 8888-7777" value="${val('tel')}"></label><label class="f">E-mail <span class="opt">(opcional, se quiser a proposta também por e-mail)</span><input id="mail" type="email" inputmode="email" autocomplete="email" value="${val('mail')}"></label>${nav()}`,
 ok:a=>{if(!a.nome||a.nome.trim().length<2)return['Digite seu nome para sabermos como chamar você.','nome'];const d=(a.tel||'').replace(/\D/g,'');if(d.length!==11||d[2]!=='9')return['Número incompleto. Use DDD + 9 dígitos, ex.: (71) 9 8888-7777.','tel'];if(a.mail&&!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(a.mail))return['Este e-mail parece incompleto. Confira o @ e o domínio.','mail'];return''}},

{l:'Outros imóveis',skippable:1,h:()=>{const a=A();return `<h1 tabindex="-1">Quer usar a energia gerada para abater a conta de outro imóvel também?</h1><p class="sub">Precisa ser da mesma concessionária e no mesmo CPF ou CNPJ.</p>${chips('comp',['Sim','Não'],{auto:a.comp!=='Sim'})}${a.comp==='Sim'?`${a.imoveis.map((m,i)=>`<div class="box"><div class="hd"><b>Imóvel ${i+2}</b>${a.imoveis.length>1?`<button type="button" class="btn link" data-rmim="${i}">Remover</button>`:''}</div>

 const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const k=Math.min(1,2000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82).split(',')[1])};img.onerror=()=>{URL.revokeObjectURL(u);res(null)};img.src=u})}
